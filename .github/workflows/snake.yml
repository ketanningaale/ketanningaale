name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ketanningaale
          outputs: |
            dist/github-snake.svg?color_snake=ffffff&color_dots[0]=161b22&color_dots[1]=21262d&color_dots[2]=444c56&color_dots[3]=768390&color_dots[4]=cdd9e5
            dist/github-snake-dark.svg?color_snake=ffffff&color_dots[0]=161b22&color_dots[1]=21262d&color_dots[2]=444c56&color_dots[3]=768390&color_dots[4]=cdd9e5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
